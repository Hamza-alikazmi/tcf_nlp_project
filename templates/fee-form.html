<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <title>Fee Application · TCF Alumni Pathways</title>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tcf-black': '#0B0C0C',
                        'tcf-dark-grey': '#1A1C1D',
                        'tcf-green': '#49C34A',
                    },
                    fontFamily: {
                        header: ['Barlow Condensed', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0C0C; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .form-input { 
            width: 100%; background-color: #0B0C0C; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 0.5rem; padding: 0.75rem 1rem; color: white; outline: none; transition: all 0.3s;
        }
        .form-input:focus { border-color: #49C34A; box-shadow: 0 0 0 2px rgba(73, 195, 74, 0.2); }
        .required::after { content: " *"; color: #49C34A; }
    </style>
</head>
<body class="antialiased">
    <div id="main">
        <!-- Navigation -->
        {% include 'navbar.html' %}

        <section class="py-16 px-6">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-4xl font-bold mb-2 text-tcf-green text-center">Tertiary Fee Process</h1>
                <p class="text-center text-gray-400 mb-12 text-sm uppercase tracking-widest">Submit Fee Voucher & Assistance Request</p>

                <div class="bg-tcf-dark-grey border border-white/10 rounded-2xl p-8 shadow-2xl">
                    <form id="feeForm" enctype="multipart/form-data" class="space-y-8">
                        
                        <!-- Row 1: Dates & Basic Info -->
                        <div class="grid md:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Today's Date</label>
                                <input type="date" name="todayDate" required class="form-input">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Full Name</label>
                                <input type="text" name="name" required placeholder="Enter student name" class="form-input">
                            </div>
                        </div>

                        <!-- Row 2: Father & Identity -->
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Father's Name</label>
                                <input type="text" name="fatherName" required placeholder="Enter father's name" class="form-input">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Student CNIC</label>
                                <input type="text" name="cnic" id="cnic" required placeholder="13 digits" class="form-input">
                            </div>
                        </div>

                        <!-- Row 3: Contacts -->
                        <div class="grid md:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Matric Roll No</label>
                                <input type="text" name="matricRoll" required class="form-input">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Phone</label>
                                <input type="tel" name="contact" id="contact" required placeholder="03XXXXXXXXX" class="form-input">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">WhatsApp</label>
                                <input type="tel" name="whatsapp" id="whatsapp" required placeholder="03XXXXXXXXX" class="form-input">
                            </div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Email</label>
                                <input type="email" name="email" required placeholder="example@domain.com" class="form-input">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">City</label>
                                <input type="text" name="city" required class="form-input">
                            </div>
                        </div>

                        <!-- Row 4: Academic Info -->
                        <div class="grid md:grid-cols-3 gap-6">
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Institute Name</label>
                                <input type="text" name="instituteName" required class="form-input">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Current Semester</label>
                                <select name="currentSemester" required class="form-input">
                                    <option value="">Select</option>
                                    <option value="1">Semester 1</option><option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option><option value="4">Semester 4</option>
                                    <option value="5">Semester 5</option><option value="6">Semester 6</option>
                                    <option value="7">Semester 7</option><option value="8">Semester 8</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Degree / Program</label>
                            <input type="text" name="degree" required placeholder="e.g. BS Computer Science" class="form-input">
                        </div>

                        <!-- Row 5: Finance & Banking -->
                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="p-4 bg-white/5 rounded-lg border border-white/10">
                                <label class="block text-xs font-bold text-gray-500 mb-3 uppercase required">Applying For</label>
                                <div class="grid grid-cols-2 gap-2 text-sm">
                                    <label class="flex items-center gap-2"><input type="checkbox" name="applyingFor" value="semesterFee" class="accent-tcf-green"> Semester</label>
                                    <label class="flex items-center gap-2"><input type="checkbox" name="applyingFor" value="hostelFee" class="accent-tcf-green"> Hostel</label>
                                    <label class="flex items-center gap-2"><input type="checkbox" name="applyingFor" value="messFee" class="accent-tcf-green"> Mess</label>
                                    <label class="flex items-center gap-2"><input type="checkbox" name="applyingFor" value="transportFee" class="accent-tcf-green"> Transport</label>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Fee Last Date</label>
                                <input type="date" name="lastDate" required class="form-input">
                            </div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Account Holder Name</label>
                                <input type="text" name="accountHolder" required class="form-input">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">IBAN Number</label>
                                <input type="text" name="iban" required placeholder="PKxxxxxxxxxxxx" class="form-input">
                            </div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">No. of Siblings</label>
                                <input type="number" name="siblings" required class="form-input">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Monthly Income (PKR)</label>
                                <input type="number" name="income" required class="form-input">
                            </div>
                        </div>

                        <!-- Row 6: File Uploads -->
                        <div class="grid md:grid-cols-2 gap-6 pt-4">
                            <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Fee Voucher</label>
                                <input type="file" name="feeVoucher" required class="text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-tcf-green file:text-black">
                            </div>
                            <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Contribution Slip</label>
                                <input type="file" name="contributionSlip" required class="text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-tcf-green file:text-black">
                            </div>
                            <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase required">Latest Result</label>
                                <input type="file" name="result" required class="text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-tcf-green file:text-black">
                            </div>
                            <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Cheque Book (Optional)</label>
                                <input type="file" name="chequeBook" class="text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-white/10 file:text-white">
                            </div>
                        </div>

                        <!-- Response Box -->
                        <div id="responseBox" class="hidden rounded-xl p-4 text-center font-bold"></div>

                        <!-- Submit Button -->
                        <button type="submit" id="submitBtn" class="w-full bg-tcf-green text-tcf-black font-bold py-4 rounded-xl hover:bg-white transition duration-300 uppercase tracking-widest">
                            Submit Fee Application
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <footer class="bg-tcf-dark-grey pt-12 pb-6 px-6 border-t border-white/5 mt-16 text-center">
            <p class="text-gray-500 text-xs tracking-widest uppercase">&copy; 2026 The Citizens Foundation. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.getElementById("feeForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const submitBtn = document.getElementById("submitBtn");
            const responseBox = document.getElementById("responseBox");

            // Checkbox validation
            const checkboxes = document.querySelectorAll('input[name="applyingFor"]:checked');
            if (checkboxes.length === 0) {
                responseBox.className = "block bg-red-500/20 text-red-500 p-4 rounded-lg mb-4";
                responseBox.innerText = "⚠️ Please select at least one 'Applying For' option.";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing... ⏳";
            
            try {
                const response = await fetch("/fee", { method: "POST", body: formData });
                const resultText = await response.text();

                responseBox.className = "block bg-tcf-green/20 text-tcf-green p-4 rounded-lg mb-4";
                responseBox.innerHTML = resultText;

                if (response.ok) form.reset();
            } catch (error) {
                responseBox.className = "block bg-red-500/20 text-red-500 p-4 rounded-lg mb-4";
                responseBox.innerText = "❌ Connection error. Please try again.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Fee Application";
            }
        });

        // Numeric constraints
        ['cnic', 'contact', 'whatsapp'].forEach(id => {
            document.getElementById(id).addEventListener('input', e => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, id === 'cnic' ? 13 : 11);
            });
        });
    </script>
</body>
</html>
