<!-- Navigation Component -->
<header class="sticky top-0 z-50 bg-tcf-black/95 backdrop-blur-md border-b border-white/10">
    <nav class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap justify-between items-center">
        <div class="flex items-center gap-4">
            <img src="{{ url_for('static', path='logo.png') }}" alt="TCF Logo" class="h-10 brightness-0 invert">
            <h1 class="text-xl font-bold text-tcf-green tracking-tight">ALUMNI PATHWAYS</h1>
        </div>

        <!-- Role Injection -->
        {% set role = inject_role(request).user_role %}

        <div class="hidden lg:flex items-center gap-8 text-xs font-semibold uppercase tracking-wider">
            <a href="/home" class="hover:text-tcf-green transition {% if request.url.path == '/home' %}text-tcf-green border-b-2 border-tcf-green{% endif %}">Home</a>
            
            {% if role == 'student' %}
                <!-- Student Specific Links -->
                <a href="/student/dashboard" class="hover:text-tcf-green transition {% if request.url.path == '/student/dashboard' %}text-tcf-green border-b-2 border-tcf-green{% endif %}">My Dashboard</a>
                <a href="/scholarship-form" class="hover:text-tcf-green transition {% if request.url.path == '/scholarship-form' %}text-tcf-green border-b-2 border-tcf-green{% endif %}">Scholarship</a>
                <a href="/fee-form" class="hover:text-tcf-green transition {% if request.url.path == '/fee-form' %}text-tcf-green border-b-2 border-tcf-green{% endif %}">Fee Support</a>
                
                <!-- Logout Button -->
                <a href="/logout" class="border border-red-500 text-red-500 px-4 py-1.5 rounded-full font-bold hover:bg-red-500 hover:text-white transition">Logout</a>
            
            {% elif role == 'admin' %}
                <!-- Admin Specific Links -->
                <a href="/admin/dashboard" class="hover:text-tcf-green transition">Admin Panel</a>
                <a href="/logout" class="border border-red-500 text-red-500 px-4 py-1.5 rounded-full font-bold hover:bg-red-500 hover:text-white transition">Logout</a>
            
            {% else %}
                <!-- Guest Links -->
                <a href="/about" class="hover:text-tcf-green transition {% if request.url.path == '/about' %}text-tcf-green border-b-2 border-tcf-green{% endif %}">About</a>
                <a href="/guide" class="hover:text-tcf-green transition {% if request.url.path == '/guide' %}text-tcf-green border-b-2 border-tcf-green{% endif %}">Alumni Guide</a>
                <a href="/success-stories" class="hover:text-tcf-green transition {% if request.url.path == '/success-stories' %}text-tcf-green border-b-2 border-tcf-green{% endif %}">Success Stories</a>
                <a href="/contact" class="hover:text-tcf-green transition {% if request.url.path == '/contact' %}text-tcf-green border-b-2 border-tcf-green{% endif %}">Contact</a>
                <a href="/login" class="bg-tcf-green text-tcf-black px-4 py-1.5 rounded-full font-bold hover:bg-white transition">Student Portal</a>
            {% endif %}
        </div>
    </nav>
</header>
