<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Management | TCF System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tcf-black': '#0B0C0C',
                        'tcf-dark-grey': '#1A1C1D',
                        'tcf-green': '#49C34A',
                    },
                    fontFamily: {
                        header: ['Barlow Condensed', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0C0C; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        .glass-card { background: #1A1C1D; border: 1px solid rgba(255,255,255,0.05); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .btn-tcf { transition: all 0.3s ease; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
        
        /* Modal scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #49C34A; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">
    <div id="main">
        {% include 'navbar.html' %}

        <div class="max-w-7xl mx-auto px-6 py-12">
            <div class="mb-10 text-center">
                <h1 class="font-header text-5xl text-white uppercase mb-2">Alumni <span class="text-tcf-green">Management</span></h1>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Scholarship Applicant Database</p>
            </div>

            <!-- Controls -->
            <div class="glass-card p-8 rounded-3xl mb-8">
                <div class="flex flex-wrap gap-4 justify-center mb-8">
                    <button class="btn-tcf bg-tcf-green text-tcf-black px-6 py-3 rounded-xl text-xs hover:bg-white" onclick="loadAllAlumni()">
                        <i class="fas fa-users mr-2"></i> All Applicants
                    </button>
                    <button class="btn-tcf bg-white/5 border border-white/10 text-white px-6 py-3 rounded-xl text-xs hover:border-tcf-green" onclick="toggleSearch('cnic')">
                        <i class="fas fa-id-card mr-2"></i> Search CNIC
                    </button>
                    <button class="btn-tcf bg-white/5 border border-white/10 text-white px-6 py-3 rounded-xl text-xs hover:border-tcf-green" onclick="toggleSearch('status')">
                        <i class="fas fa-filter mr-2"></i> Filter Status
                    </button>
                </div>

                <div id="searchContainer" class="hidden border-t border-white/5 pt-8">
                    <div class="flex flex-wrap items-end gap-4 max-w-2xl mx-auto">
                        <div id="cnicBox" class="flex-1 hidden">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Enter CNIC</label>
                            <input type="text" id="cnicInput" class="w-full bg-tcf-black border border-white/10 rounded-xl px-4 py-3 text-white focus:border-tcf-green outline-none" placeholder="1234567890123">
                        </div>
                        <div id="statusBox" class="flex-1 hidden">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Select Status</label>
                            <select id="statusSelect" class="w-full bg-tcf-black border border-white/10 rounded-xl px-4 py-3 text-white focus:border-tcf-green outline-none">
                                <option value="Pending">Pending</option>
                                <option value="In Review">In Review</option>
                                <option value="Approved">Approved</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                        <button onclick="executeSearch()" class="bg-tcf-green text-tcf-black font-black px-8 py-3 rounded-xl text-xs">Search</button>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div id="resultsArea" class="glass-card rounded-3xl overflow-hidden hidden">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-white/5 text-[10px] font-black uppercase tracking-widest text-gray-400">
                            <th class="px-6 py-4">Applicant Name</th>
                            <th class="px-6 py-4">CNIC</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="alumniTableBody" class="text-sm divide-y divide-white/5"></tbody>
                </table>
            </div>

            <div id="noData" class="text-center py-20 hidden">
                <i class="fas fa-folder-open text-4xl text-gray-700 mb-4"></i>
                <p class="text-gray-500 font-bold uppercase text-xs tracking-widest">No matching records found</p>
            </div>
        </div>
    </div>

    <!-- UPDATE MODAL (Example Minimal - Expand fields as needed) -->
    <div id="updateModal" class="fixed inset-0 bg-tcf-black/90 backdrop-blur-sm z-50 hidden items-center justify-center p-6">
        <div class="bg-tcf-dark-grey border border-white/10 rounded-3xl w-full max-w-2xl max-h-[80vh] overflow-y-auto custom-scroll">
            <div class="p-8">
                <h2 class="font-header text-3xl text-tcf-green mb-6 uppercase">Update Application</h2>
                <form id="editForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="editId">
                    <div class="md:col-span-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Application Status</label>
                        <select id="editStatus" class="w-full bg-tcf-black border border-white/10 rounded-xl p-3 mt-2 text-white">
                            <option value="Pending">Pending</option>
                            <option value="In Review">In Review</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                    <!-- Add other inputs similarly -->
                </form>
                <div class="mt-8 flex gap-4">
                    <button onclick="saveUpdate()" class="flex-1 bg-tcf-green text-tcf-black font-black py-4 rounded-xl text-xs uppercase">Save Changes</button>
                    <button onclick="closeModal()" class="flex-1 bg-white/5 text-white font-black py-4 rounded-xl text-xs uppercase">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let searchMode = 'all';

        function toggleSearch(type) {
            document.getElementById('searchContainer').classList.remove('hidden');
            document.getElementById('cnicBox').classList.toggle('hidden', type !== 'cnic');
            document.getElementById('statusBox').classList.toggle('hidden', type !== 'status');
            searchMode = type;
        }

        async function loadAllAlumni() {
            const res = await fetch('/api/alumni/all');
            const data = await res.json();
            renderTable(data);
        }

        async function executeSearch() {
            let url = '';
            if(searchMode === 'cnic') {
                const val = document.getElementById('cnicInput').value;
                url = `/api/alumni/search/cnic/${val}`;
            } else {
                const val = document.getElementById('statusSelect').value;
                url = `/api/alumni/search/status/${val}`;
            }
            const res = await fetch(url);
            const data = await res.json();
            renderTable(data);
        }

        function renderTable(data) {
            const tbody = document.getElementById('alumniTableBody');
            const container = document.getElementById('resultsArea');
            const noData = document.getElementById('noData');
            
            tbody.innerHTML = '';
            if(!data || data.length === 0) {
                container.classList.add('hidden');
                noData.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            noData.classList.add('hidden');

            data.forEach(item => {
                const statusColor = item.status === 'Approved' ? 'bg-tcf-green/20 text-tcf-green' : 
                                  item.status === 'Rejected' ? 'bg-red-500/20 text-red-500' : 'bg-amber-500/20 text-amber-500';
                
                tbody.innerHTML += `
                    <tr class="hover:bg-white/[0.02] transition">
                        <td class="px-6 py-5 font-bold text-white">${item.name}</td>
                        <td class="px-6 py-5 font-mono text-xs text-gray-400">${item.cnic}</td>
                        <td class="px-6 py-5"><span class="status-badge ${statusColor}">${item.status}</span></td>
                        <td class="px-6 py-5 text-right">
                            <button onclick="openEdit('${item.id}', '${item.status}')" class="text-tcf-green hover:text-white mr-4"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteAlumni('${item.id}')" class="text-red-500 hover:text-white"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openEdit(id, status) {
            document.getElementById('editId').value = id;
            document.getElementById('editStatus').value = status;
            document.getElementById('updateModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('updateModal').style.display = 'none'; }

        async function saveUpdate() {
            const id = document.getElementById('editId').value;
            const status = document.getElementById('editStatus').value;
            await fetch(`/api/alumni/update/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status })
            });
            closeModal();
            loadAllAlumni();
        }

        async function deleteAlumni(id) {
            if(!confirm('Permanent Delete?')) return;
            await fetch(`/api/alumni/delete/${id}`, { method: 'DELETE' });
            loadAllAlumni();
        }
    </script>
</body>
</html>
