<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Handler | TCF System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            margin: 10px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-warning {
            background: #ed8936;
            color: white;
        }

        .btn-warning:hover {
            background: #dd6b20;
        }

        .content {
            padding: 30px;
        }

        .query-list {
            display: grid;
            gap: 20px;
        }

        .query-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .query-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        .query-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .query-no {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .query-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-forwarded {
            background: #fef3c7;
            color: #d97706;
        }

        .status-responded {
            background: #d1fae5;
            color: #065f46;
        }

        .query-text {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .query-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #718096;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .card-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 14px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            animation: slideDown 0.3s;
            text-align: center;
        }

        .department-modal {
            max-width: 400px;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 24px;
            margin-bottom: 20px;
            color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-direction: column;
        }

        .modal-btn {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .modal-btn-scholarship {
            background: #667eea;
            color: white;
        }

        .modal-btn-fee {
            background: #48bb78;
            color: white;
        }

        .modal-btn-close {
            background: #f56565;
            color: white;
        }

        .update-modal-content {
            max-width: 600px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #718096;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #a0aec0;
        }

        .selected-type {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .welcome-message {
            text-align: center;
            padding: 50px;
            color: #718096;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Query Management System</h1>
            <p>Manage and track all forwarded queries</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="showDepartmentModal('all')">📊 All Queries</button>
            <button class="btn btn-secondary" onclick="showDepartmentModal('pending')">⏳ Pending Queries</button>
        </div>

        <div class="content">
            <div id="selectedType" class="selected-type"></div>
            <div id="queryList" class="query-list">
                <div class="welcome-message">
                    👋 Welcome! Please click "All Queries" or "Pending Queries" to continue.
                </div>
            </div>
        </div>
    </div>

    <!-- Department Selection Modal -->
    <div id="departmentModal" class="modal">
        <div class="modal-content department-modal">
            <div class="modal-header" id="modalTitle">Select Department</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-scholarship" onclick="selectDepartment('Scholarship-Section')">🎓 Scholarship Section</button>
                <button class="modal-btn modal-btn-fee" onclick="selectDepartment('Fee-Section')">💰 Fee Section</button>
                <button class="modal-btn modal-btn-close" onclick="closeDepartmentModal()">❌ Cancel</button>
            </div>
        </div>
    </div>

    <!-- Update Modal -->
    <div id="updateModal" class="modal">
        <div class="modal-content update-modal-content">
            <div class="modal-header">✏️ Update Query</div>
            <form id="updateForm">
                <input type="hidden" id="updateQueryNo">
                <div class="form-group">
                    <label>Query Number</label>
                    <input type="text" id="updateQueryNoDisplay" readonly>
                </div>
                <div class="form-group">
                    <label>CNIC</label>
                    <input type="text" id="updateCnic" required>
                </div>
                <div class="form-group">
                    <label>Query</label>
                    <textarea id="updateQuery" required></textarea>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="updateDepartment">
                        <option value="Scholarship-Section">Scholarship Section</option>
                        <option value="Fee-Section">Fee Section</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Response</label>
                    <textarea id="updateResponse" placeholder="Enter response to this query..."></textarea>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="updateStatus">
                        <option value="forwarded">Forwarded</option>
                        <option value="responded">Responded</option>
                    </select>
                </div>
                <div class="modal-buttons" style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-danger btn-sm" onclick="closeUpdateModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Update Query</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentQueryType = null; // 'all' or 'pending'
        let currentDepartment = null;

        function showDepartmentModal(type) {
            currentQueryType = type;
            const modalTitle = document.getElementById('modalTitle');
            if (type === 'all') {
                modalTitle.innerHTML = '📊 Select Department for All Queries';
            } else {
                modalTitle.innerHTML = '⏳ Select Department for Pending Queries';
            }
            document.getElementById('departmentModal').style.display = 'block';
        }

        function selectDepartment(department) {
            currentDepartment = department;
            closeDepartmentModal();
            
            if (currentQueryType === 'all') {
                loadAllQueries();
            } else if (currentQueryType === 'pending') {
                loadPendingQueries();
            }
        }

        function closeDepartmentModal() {
            document.getElementById('departmentModal').style.display = 'none';
        }

        async function loadAllQueries() {
            document.getElementById('selectedType').innerHTML = `📌 Showing ALL queries for ${currentDepartment}`;
            document.getElementById('queryList').innerHTML = '<div class="loading">Loading queries...</div>';
            
            try {
                const response = await fetch(`http://localhost:3001/api/query-management/department/${currentDepartment}`);
                const result = await response.json();
                
                if (result.success) {
                    displayQueries(result.data);
                } else {
                    document.getElementById('queryList').innerHTML = '<div class="no-data">Failed to load queries</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('queryList').innerHTML = '<div class="no-data">Error loading queries</div>';
            }
        }

        async function loadPendingQueries() {
            document.getElementById('selectedType').innerHTML = `⏳ Showing PENDING (forwarded) queries for ${currentDepartment}`;
            document.getElementById('queryList').innerHTML = '<div class="loading">Loading queries...</div>';
            
            try {
                const response = await fetch(`http://localhost:3001/api/query-management/pending/${currentDepartment}`);
                const result = await response.json();
                
                if (result.success) {
                    displayQueries(result.data);
                } else {
                    document.getElementById('queryList').innerHTML = '<div class="no-data">Failed to load pending queries</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('queryList').innerHTML = '<div class="no-data">Error loading pending queries</div>';
            }
        }

        function displayQueries(queries) {
            const container = document.getElementById('queryList');
            
            if (!queries || queries.length === 0) {
                container.innerHTML = '<div class="no-data">No queries found for this department</div>';
                return;
            }
            
            container.innerHTML = queries.map(query => `
                <div class="query-card">
                    <div class="query-header">
                        <div class="query-no">Query #${query.query_no}</div>
                        <div class="query-status status-${query.status}">${query.status.toUpperCase()}</div>
                    </div>
                    <div class="query-text">❓ <strong>Query:</strong> ${escapeHtml(query.query)}</div>
                    <div class="query-meta">
                        <span>📋 CNIC: ${query.cnic}</span>
                        <span>🏢 Department: ${query.department}</span>
                        <span>📅 Date: ${new Date(query.createdAt).toLocaleDateString()}</span>
                        <span>⏰ Time: ${new Date(query.createdAt).toLocaleTimeString()}</span>
                        ${query.confidence ? `<span>📊 Confidence: ${query.confidence}%</span>` : ''}
                    </div>
                    ${query.response ? `<div class="query-text">💬 <strong>Response:</strong> ${escapeHtml(query.response)}</div>` : '<div class="query-text">💬 <strong>Response:</strong> <em>No response yet</em></div>'}
                    <div class="card-buttons">
                        <button class="btn btn-warning btn-sm" onclick="editQuery(${query.query_no})">✏️ Update</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteQuery(${query.query_no})">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function editQuery(queryNo) {
            try {
                const response = await fetch(`http://localhost:3001/api/query-management/${queryNo}`);
                const result = await response.json();
                
                if (result.success) {
                    const query = result.data;
                    document.getElementById('updateQueryNo').value = query.query_no;
                    document.getElementById('updateQueryNoDisplay').value = query.query_no;
                    document.getElementById('updateCnic').value = query.cnic;
                    document.getElementById('updateQuery').value = query.query;
                    document.getElementById('updateDepartment').value = query.department;
                    document.getElementById('updateResponse').value = query.response || '';
                    document.getElementById('updateStatus').value = query.status;
                    document.getElementById('updateModal').style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error loading query details');
            }
        }

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const queryNo = document.getElementById('updateQueryNo').value;
            const updateData = {
                cnic: document.getElementById('updateCnic').value,
                query: document.getElementById('updateQuery').value,
                department: document.getElementById('updateDepartment').value,
                response: document.getElementById('updateResponse').value,
                status: document.getElementById('updateStatus').value
            };
            
            try {
                const response = await fetch(`http://localhost:3001/api/query-management/${queryNo}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('✅ Query updated successfully!');
                    closeUpdateModal();
                    if (currentQueryType === 'all') {
                        loadAllQueries();
                    } else if (currentQueryType === 'pending') {
                        loadPendingQueries();
                    }
                } else {
                    alert('❌ Error updating query: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error updating query');
            }
        });

        async function deleteQuery(queryNo) {
            if (confirm(`⚠️ Are you sure you want to delete Query #${queryNo}? This action cannot be undone!`)) {
                try {
                    const response = await fetch(`http://localhost:3001/api/query-management/${queryNo}`, {
                        method: 'DELETE'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('✅ Query deleted successfully!');
                        if (currentQueryType === 'all') {
                            loadAllQueries();
                        } else if (currentQueryType === 'pending') {
                            loadPendingQueries();
                        }
                    } else {
                        alert('❌ Error deleting query: ' + result.message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('❌ Error deleting query');
                }
            }
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').style.display = 'none';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Close modals when clicking outside
        window.onclick = function(event) {
            const departmentModal = document.getElementById('departmentModal');
            const updateModal = document.getElementById('updateModal');
            if (event.target === departmentModal) {
                closeDepartmentModal();
            }
            if (event.target === updateModal) {
                closeUpdateModal();
            }
        }
    </script>
</body>
</html>
