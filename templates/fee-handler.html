<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Applications | TCF System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tcf-black': '#0B0C0C',
                        'tcf-dark-grey': '#1A1C1D',
                        'tcf-green': '#49C34A',
                    },
                    fontFamily: {
                        header: ['Barlow Condensed', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0C0C; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        .glass-card { background: #1A1C1D; border: 1px solid rgba(255,255,255,0.05); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .btn-tcf { transition: all 0.3s ease; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
    </style>
</head>
<body class="antialiased">
    <div id="main">
        {% include 'navbar.html' %}

        <div class="max-w-7xl mx-auto px-6 py-12">
            <div class="mb-10 text-center">
                <h1 class="font-header text-5xl text-white uppercase mb-2">Fee <span class="text-tcf-green">Applications</span></h1>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Alumni Financial Aid Management</p>
            </div>

            <!-- Controls -->
            <div class="glass-card p-8 rounded-3xl mb-8">
                <div class="flex flex-wrap gap-4 justify-center mb-8">
                    <button class="btn-tcf bg-tcf-green text-tcf-black px-6 py-3 rounded-xl text-xs hover:bg-white" onclick="loadAllApps()">
                        <i class="fas fa-list mr-2"></i> All Applications
                    </button>
                    <div class="flex gap-2">
                        <input type="text" id="cnicSearch" placeholder="CNIC (13 digits)" class="bg-tcf-black border border-white/10 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-tcf-green">
                        <button onclick="searchByCNIC()" class="bg-white/5 border border-white/10 text-white px-4 py-2 rounded-xl hover:border-tcf-green transition"><i class="fas fa-search"></i></button>
                    </div>
                </div>

                <div id="resultsTable" class="hidden overflow-x-auto rounded-2xl border border-white/5">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-white/5 text-[10px] font-black uppercase tracking-widest text-gray-400">
                            <tr>
                                <th class="px-6 py-4">Applicant</th>
                                <th class="px-6 py-4">CNIC</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FOR UPDATING STATUS -->
    <div id="statusModal" class="fixed inset-0 bg-tcf-black/90 backdrop-blur-sm z-50 hidden items-center justify-center p-6">
        <div class="bg-tcf-dark-grey border border-white/10 rounded-3xl w-full max-w-md p-8 shadow-2xl">
            <h2 class="font-header text-3xl text-tcf-green mb-6 uppercase">Update Status</h2>
            <input type="hidden" id="targetAppId">
            <div class="space-y-4">
                <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Select New Status</label>
                <select id="newStatus" class="w-full bg-tcf-black border border-white/10 rounded-xl p-4 text-white outline-none focus:border-tcf-green">
                    <option value="Pending">Pending</option>
                    <option value="In Review">In Review</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
                <div class="flex gap-4 pt-4">
                    <button onclick="submitStatusUpdate()" class="flex-1 bg-tcf-green text-tcf-black font-black py-4 rounded-xl text-xs uppercase">Save</button>
                    <button onclick="closeModal()" class="flex-1 bg-white/5 text-white font-black py-4 rounded-xl text-xs uppercase">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadAllApps() {
            const res = await fetch('/api/fee/all');
            const data = await res.json();
            renderTable(data);
        }

        async function searchByCNIC() {
            const cnic = document.getElementById('cnicSearch').value;
            const res = await fetch(`/api/fee/search/${cnic}`);
            const data = await res.json();
            renderTable(data);
        }

        function renderTable(apps) {
            const body = document.getElementById('tableBody');
            document.getElementById('resultsTable').classList.remove('hidden');
            body.innerHTML = '';
            apps.forEach(app => {
                body.innerHTML += `
                    <tr class="hover:bg-white/[0.02]">
                        <td class="px-6 py-4 font-bold text-white">${app.name}</td>
                        <td class="px-6 py-4 font-mono text-xs text-gray-500">${app.cnic}</td>
                        <td class="px-6 py-4">
                            <span class="status-badge ${app.status === 'Approved' ? 'bg-tcf-green/20 text-tcf-green' : 'bg-amber-500/20 text-amber-500'}">
                                ${app.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="openModal('${app.id}')" class="text-tcf-green hover:text-white"><i class="fas fa-edit"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal(id) {
            document.getElementById('targetAppId').value = id;
            document.getElementById('statusModal').classList.replace('hidden', 'flex');
        }

        function closeModal() {
            document.getElementById('statusModal').classList.replace('flex', 'hidden');
        }

        async function submitStatusUpdate() {
            const id = document.getElementById('targetAppId').value;
            const status = document.getElementById('newStatus').value;
            await fetch(`/api/fee/status/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status })
            });
            closeModal();
            loadAllApps();
        }
    </script>
</body>
</html>
