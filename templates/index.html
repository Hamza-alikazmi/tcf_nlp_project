<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>TCF AI Portal · TCF Alumni Pathways</title>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tcf-black': '#0B0C0C',
                        'tcf-dark-grey': '#1A1C1D',
                        'tcf-green': '#49C34A',
                    },
                    fontFamily: {
                        header: ['Barlow Condensed', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0C0C; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
        
        /* Custom star rating style - Themed to Green */
        .star-rating { direction: rtl; display: inline-flex; gap: 0.25rem; }
        .star-rating input[type="radio"] { display: none; }
        .star-rating label { font-size: 1.5rem; cursor: pointer; transition: color 0.2s; color: #333; }
        .star-rating input[type="radio"]:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color: #49C34A; }

        .glass-input { 
            background: #0B0C0C; 
            border: 1px solid rgba(255,255,255,0.05); 
            color: white;
        }
        .glass-input:focus {
            border-color: #49C34A;
            outline: none;
            box-shadow: 0 0 10px rgba(73, 195, 74, 0.1);
        }
    </style>
</head>
<body class="antialiased">
    <div id="main">
        {% include 'navbar.html' %}

        <section class="relative py-16 px-6 text-center overflow-hidden">
            <div class="relative z-10">
                <h1 class="text-5xl font-black text-tcf-green mb-3">TCF AI Support System</h1>
                <p class="text-gray-500 mb-8 text-xs font-bold uppercase tracking-[0.3em]">Agentic Complaint & Query Management</p>
                
                <div class="mb-12">
                    <a href="/home" class="inline-block rounded-full border-2 border-tcf-green text-tcf-green px-10 py-2.5 text-sm font-bold hover:bg-tcf-green hover:text-tcf-black transition duration-300 uppercase tracking-widest">
                        Return to Home
                    </a>
                </div>
            </div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-tcf-green/5 rounded-full blur-[120px]"></div>
        </section>

        <main class="max-w-7xl mx-auto px-6 pb-24">
            <div class="grid md:grid-cols-2 gap-8 mb-8">
                
                <div class="bg-tcf-dark-grey border border-white/5 p-8 rounded-3xl shadow-2xl relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition">
                        <i class="fas fa-exclamation-circle text-8xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3 text-white">
                        <span class="text-red-500"><i class="fas fa-bullhorn"></i></span>
                        Submit Complaint
                    </h2>
                    <textarea id="complaintText" class="glass-input w-full p-4 rounded-2xl text-sm mb-4" rows="5" placeholder="Describe your issue in detail..."></textarea>
                    <button onclick="submitComplaint()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-xl uppercase text-xs tracking-widest transition-all">
                        <i class="fas fa-paper-plane mr-2"></i>File Official Complaint
                    </button>
                    <div id="complaintResponse" class="mt-4 p-4 bg-tcf-black/50 rounded-xl text-xs text-gray-400 hidden italic"></div>
                </div>

                <div class="bg-tcf-dark-grey border border-white/5 p-8 rounded-3xl shadow-2xl relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition">
                        <i class="fas fa-robot text-8xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3 text-white">
                        <span class="text-tcf-green"><i class="fas fa-microchip"></i></span>
                        AI Query Agent
                    </h2>
                    <textarea id="queryText" class="glass-input w-full p-4 rounded-2xl text-sm mb-4" rows="5" placeholder="Ask anything about TCF Alumni Pathways..."></textarea>
                    <button onclick="submitQuery()" class="w-full bg-tcf-green text-tcf-black font-black py-4 rounded-xl uppercase text-xs tracking-widest transition-all">
                        <i class="fas fa-bolt mr-2"></i>Ask AI Assistant
                    </button>
                    <div id="queryResponse" class="mt-4 p-4 bg-tcf-black/50 rounded-xl text-xs text-tcf-green hidden border border-tcf-green/10"></div>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-8">
                
                <div class="bg-tcf-dark-grey border border-white/5 p-8 rounded-3xl shadow-2xl">
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3 text-white">
                        <span class="text-blue-400"><i class="fas fa-location-crosshairs"></i></span>
                        Track Status
                    </h2>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="trackId" placeholder="CMP-2026-XXXXX" class="glass-input flex-1 p-4 rounded-xl text-sm font-mono">
                        <button onclick="trackComplaint()" class="bg-white/10 hover:bg-tcf-green hover:text-tcf-black text-white px-6 rounded-xl transition-all">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div id="trackResponse" class="p-4 bg-tcf-black/30 rounded-xl border border-white/5 text-xs text-gray-500 hidden">
                        </div>
                </div>

                <div class="bg-tcf-dark-grey border border-white/5 p-8 rounded-3xl shadow-2xl">
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3 text-white">
                        <span class="text-amber-400"><i class="fas fa-star-half-alt"></i></span>
                        Rate Resolution
                    </h2>
                    <div class="space-y-5">
                        <input type="text" id="feedbackId" placeholder="Complaint ID" class="glass-input w-full p-4 rounded-xl text-sm">

                        <div class="flex items-center justify-between px-2">
                            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">Your Rating</span>
                            <div class="star-rating" id="starRating">
                                <input type="radio" id="star5" name="rating" value="5"><label for="star5" class="fas fa-star"></label>
                                <input type="radio" id="star4" name="rating" value="4"><label for="star4" class="fas fa-star"></label>
                                <input type="radio" id="star3" name="rating" value="3"><label for="star3" class="fas fa-star"></label>
                                <input type="radio" id="star2" name="rating" value="2"><label for="star2" class="fas fa-star"></label>
                                <input type="radio" id="star1" name="rating" value="1"><label for="star1" class="fas fa-star"></label>
                            </div>
                        </div>

                        <textarea id="feedbackComment" rows="2" placeholder="Tell us how we did..." class="glass-input w-full p-4 rounded-xl text-sm"></textarea>
                        
                        <button onclick="submitFeedback()" class="w-full bg-white/5 border border-white/10 hover:border-tcf-green hover:text-tcf-green text-white font-black py-4 rounded-xl uppercase text-xs tracking-widest transition-all">
                            Submit Feedback
                        </button>
                        <div id="feedbackResponse" class="text-center text-[10px] text-gray-600 font-bold uppercase tracking-tighter"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="py-12 bg-tcf-black border-t border-white/5 text-center">
            <p class="text-[10px] font-black text-gray-700 uppercase tracking-[0.4em] mb-2">TCF AI Network Integrity</p>
            <p class="text-xs text-gray-500 italic">"Technology in service of education"</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
