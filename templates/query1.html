<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>TCF Support · Alumni Pathways</title>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tcf-black': '#0B0C0C',
                        'tcf-dark-grey': '#1A1C1D',
                        'tcf-green': '#49C34A',
                    },
                    fontFamily: {
                        header: ['Barlow Condensed', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0C0C; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
        .glass-input { 
            background: #0B0C0C; border: 1px solid rgba(255,255,255,0.05); color: white;
        }
        .glass-input:focus { border-color: #49C34A; outline: none; box-shadow: 0 0 10px rgba(73, 195, 74, 0.1); }
        .star-rating { direction: rtl; display: inline-flex; gap: 0.25rem; }
        .star-rating input[type="radio"] { display: none; }
        .star-rating label { font-size: 1.5rem; cursor: pointer; color: #333; transition: color 0.2s; }
        .star-rating input[type="radio"]:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label { color: #49C34A; }
        
        /* Custom scrollbar for query response */
        #queryResponse::-webkit-scrollbar { width: 4px; }
        #queryResponse::-webkit-scrollbar-thumb { background: #49C34A; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">
    <div id="main">
        {% include 'navbar.html' %}

        <!-- Header -->
        <section class="py-12 px-6 text-center">
            <h1 class="text-5xl font-black text-tcf-green mb-2">TCF AI Support</h1>
            <p class="text-gray-500 text-xs font-bold uppercase tracking-[0.3em]">Query Assistant & Complaint Hub</p>
        </section>

        <main class="max-w-7xl mx-auto px-6 pb-24">
            <div class="grid md:grid-cols-2 gap-8">
                
                <!-- 1. OFFICIAL COMPLAINT FORM -->
                <div class="bg-tcf-dark-grey border border-white/5 p-8 rounded-3xl shadow-2xl relative">
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3 text-white">
                        <span class="text-red-500"><i class="fas fa-bullhorn"></i></span>
                        Submit Complaint
                    </h2>
                    <div class="space-y-4">
                        <input type="text" id="complaintCnic" maxlength="13" placeholder="Enter CNIC (13 Digits)" 
                            class="glass-input w-full p-4 rounded-xl text-sm font-mono">
                        
                        <select id="deptSelect" class="glass-input w-full p-4 rounded-xl text-sm">
                            <option value="">Select Department</option>
                            <option value="Admission">Admission</option>
                            <option value="Scholarship">Scholarship</option>
                            <option value="Fee">Fee Process</option>
                            <option value="Other">Other</option>
                        </select>

                        <textarea id="complaintText" class="glass-input w-full p-4 rounded-2xl text-sm" rows="4" placeholder="Describe your issue in detail..."></textarea>
                        
                        <button onclick="submitComplaint()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-xl uppercase text-xs tracking-widest transition-all">
                            File Official Complaint
                        </button>
                        <div id="complaintResponse" class="mt-4 p-4 rounded-xl text-xs hidden"></div>
                    </div>
                </div>

                <!-- 2. AI QUERY AGENT -->
                <div class="bg-tcf-dark-grey border border-white/5 p-8 rounded-3xl shadow-2xl relative">
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3 text-white">
                        <span class="text-tcf-green"><i class="fas fa-robot"></i></span>
                        AI Query Agent
                    </h2>
                    <div class="space-y-4">
                        <p class="text-gray-400 text-xs mb-2">Ask anything about TCF Alumni Pathways...</p>
                        <textarea id="queryText" class="glass-input w-full p-4 rounded-2xl text-sm" rows="7" placeholder="e.g. How do I apply for scholarship?"></textarea>
                        
                        <button onclick="submitQuery()" class="w-full bg-tcf-green text-tcf-black font-black py-4 rounded-xl uppercase text-xs tracking-widest transition-all">
                            <i class="fas fa-bolt mr-2"></i>Ask AI Assistant
                        </button>
                        
                        <div id="queryResponse" class="mt-4 p-4 bg-tcf-black/50 rounded-xl text-xs text-tcf-green hidden border border-tcf-green/10 max-h-[150px] overflow-y-auto italic"></div>
                    </div>
                </div>

                <!-- 3. TRACK COMPLAINT (UPDATED) -->
                <div class="bg-tcf-dark-grey border border-white/5 p-8 rounded-3xl shadow-2xl">
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3 text-white">
                        <span class="text-blue-400"><i class="fas fa-location-crosshairs"></i></span>
                        Track Status
                    </h2>
                    <div class="flex gap-2">
                        <input type="text" id="trackId" placeholder="CMP-2026-XXXXX" class="glass-input flex-1 p-4 rounded-xl text-sm font-mono">
                        <button onclick="trackComplaint()" class="bg-white/10 hover:bg-tcf-green hover:text-tcf-black text-white px-6 rounded-xl transition-all">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div id="trackResponse" class="mt-4 p-4 bg-tcf-black/30 rounded-xl border border-white/5 text-xs hidden">
                        <!-- Status results here -->
                    </div>
                </div>

                <!-- 4. FEEDBACK (UPDATED) -->
                <div class="bg-tcf-dark-grey border border-white/5 p-8 rounded-3xl shadow-2xl">
                    <h2 class="text-2xl font-bold mb-4 flex items-center gap-3 text-white">
                        <span class="text-amber-400"><i class="fas fa-star-half-alt"></i></span>
                        Rate Resolution
                    </h2>
                    <div class="space-y-4">
                        <input type="text" id="feedbackId" placeholder="Complaint ID (e.g. CMP-2026-00001)" class="glass-input w-full p-4 rounded-xl text-sm">
                        <div class="flex items-center justify-between bg-tcf-black/40 p-3 rounded-xl">
                            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Experience</span>
                            <div class="star-rating" id="starContainer">
                                <input type="radio" id="star5" name="rating" value="5"><label for="star5" class="fas fa-star"></label>
                                <input type="radio" id="star4" name="rating" value="4"><label for="star4" class="fas fa-star"></label>
                                <input type="radio" id="star3" name="rating" value="3"><label for="star3" class="fas fa-star"></label>
                                <input type="radio" id="star2" name="rating" value="2"><label for="star2" class="fas fa-star"></label>
                                <input type="radio" id="star1" name="rating" value="1"><label for="star1" class="fas fa-star"></label>
                            </div>
                        </div>
                        <button onclick="submitFeedback()" class="w-full bg-white/5 border border-white/10 hover:border-tcf-green hover:text-tcf-green text-white font-black py-3 rounded-xl uppercase text-xs tracking-widest transition-all">
                            Submit Feedback
                        </button>
                        <div id="feedbackResponse" class="text-center text-[10px] font-bold uppercase tracking-widest mt-2"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. Submit Complaint
        async function submitComplaint() {
            const cnic = document.getElementById('complaintCnic').value.trim();
            const text = document.getElementById('complaintText').value.trim();
            const dept = document.getElementById('deptSelect').value;
            const resDiv = document.getElementById('complaintResponse');

            if(!cnic || !text) { alert('Please enter CNIC and Complaint details'); return; }
            if(cnic.length !== 13) { alert('CNIC must be 13 digits'); return; }

            resDiv.classList.remove('hidden', 'text-tcf-green', 'text-red-500');
            resDiv.className = "mt-4 p-4 rounded-xl text-xs bg-white/5 text-gray-400 italic";
            resDiv.innerText = "Processing complaint...";

            try {
                const response = await fetch('/complaint', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text: text, cnic: cnic, department: dept })
                });
                const data = await response.json();
                resDiv.innerText = data.message;
                resDiv.classList.add(response.ok ? 'text-tcf-green' : 'text-red-500');
            } catch (e) {
                resDiv.innerText = "Error connection to server.";
                resDiv.classList.add('text-red-500');
            }
        }

        // 2. Submit AI Query
        async function submitQuery() {
            const text = document.getElementById('queryText').value.trim();
            const resDiv = document.getElementById('queryResponse');
            
            if(!text) return;

            resDiv.classList.remove('hidden');
            resDiv.innerText = "AI Assistant is thinking...";

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ question: text })
                });
                const data = await response.json();
                resDiv.innerText = data.answer;
            } catch (e) {
                resDiv.innerText = "AI Agent is offline. Try again later.";
            }
        }

        // 3. Track Complaint Status
        async function trackComplaint() {
            const trackId = document.getElementById('trackId').value.trim();
            const resDiv = document.getElementById('trackResponse');

            if(!trackId) { alert('Please enter a Complaint ID'); return; }

            resDiv.classList.remove('hidden');
            resDiv.innerText = "Searching...";

            try {
                const response = await fetch(`/track/${trackId}`);
                const data = await response.json();

                if(response.ok) {
                    resDiv.innerHTML = `
                        <div class="space-y-1">
                            <p><span class="text-gray-400">Status:</span> <span class="text-tcf-green font-bold uppercase">${data.status}</span></p>
                            <p><span class="text-gray-400">Department:</span> ${data.department}</p>
                            ${data.resolution ? `<p class="mt-2 p-2 bg-tcf-green/10 rounded border border-tcf-green/20"><span class="text-tcf-green font-bold">Resolution:</span> ${data.resolution}</p>` : ''}
                        </div>
                    `;
                } else {
                    resDiv.innerText = data.detail || "Complaint not found.";
                    resDiv.classList.add('text-red-400');
                }
            } catch (e) {
                resDiv.innerText = "Error tracking status.";
            }
        }

        // 4. Submit Feedback/Rating
        async function submitFeedback() {
            const complaintId = document.getElementById('feedbackId').value.trim();
            const rating = document.querySelector('input[name="rating"]:checked')?.value;
            const resDiv = document.getElementById('feedbackResponse');

            if(!complaintId || !rating) { 
                alert('Please provide both Complaint ID and a Star Rating'); 
                return; 
            }

            resDiv.innerText = "Submitting feedback...";
            resDiv.className = "text-center text-[10px] font-bold uppercase tracking-widest mt-2 text-gray-500";

            try {
                // Maan lijiye aapke paas /feedback endpoint hai
                const response = await fetch('/feedback', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ complaint_id: complaintId, rating: parseInt(rating) })
                });

                if(response.ok) {
                    resDiv.innerText = "Thank you for your feedback!";
                    resDiv.classList.replace('text-gray-500', 'text-tcf-green');
                    // Reset form
                    document.getElementById('feedbackId').value = "";
                    document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);
                } else {
                    resDiv.innerText = "Failed to submit feedback.";
                    resDiv.classList.replace('text-gray-500', 'text-red-500');
                }
            } catch (e) {
                resDiv.innerText = "Server Error.";
                resDiv.classList.add('text-red-500');
            }
        }
    </script>
</body>
</html>
