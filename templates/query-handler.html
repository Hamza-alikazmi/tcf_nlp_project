<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Query Management | TCF System</title>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tcf-black': '#0B0C0C',
                        'tcf-dark-grey': '#1A1C1D',
                        'tcf-green': '#49C34A',
                    },
                    fontFamily: {
                        header: ['Barlow Condensed', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0C0C; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
        
        /* Modal animations */
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        .modal-content-enter { animation: slideUp 0.3s ease-out forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen relative overflow-x-hidden">
    
    <!-- Background Decor -->
    <div class="fixed top-0 right-0 w-[600px] h-[600px] bg-tcf-green/5 rounded-full blur-[150px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-0 left-0 w-[500px] h-[500px] bg-blue-500/5 rounded-full blur-[120px] pointer-events-none -z-10"></div>

    <div id="main" class="flex flex-col min-h-screen">
        <!-- Navigation -->
        {% include 'navbar.html' %}

        <!-- Header -->
        <div class="pt-12 pb-8 px-6 text-center">
            <h1 class="text-4xl md:text-5xl font-black text-white mb-2">
                <i class="fas fa-tasks text-tcf-green mr-3"></i>Query Management
            </h1>
            <p class="text-gray-400 text-sm font-bold uppercase tracking-[0.2em]">Manage and track all forwarded queries</p>
        </div>

        <!-- Controls -->
        <div class="max-w-7xl mx-auto px-6 w-full mb-10 flex flex-wrap justify-center gap-4">
            <button onclick="showDepartmentModal('all')" class="bg-blue-600/20 border border-blue-500/50 hover:bg-blue-600 text-blue-400 hover:text-white px-6 py-3 rounded-xl font-bold uppercase tracking-wider transition duration-300 flex items-center gap-2">
                <i class="fas fa-layer-group"></i> All Queries
            </button>
            <button onclick="showDepartmentModal('pending')" class="bg-amber-500/20 border border-amber-500/50 hover:bg-amber-500 text-amber-400 hover:text-tcf-black px-6 py-3 rounded-xl font-bold uppercase tracking-wider transition duration-300 flex items-center gap-2">
                <i class="fas fa-hourglass-half"></i> Pending Queries
            </button>
        </div>

        <!-- Content Area -->
        <div class="max-w-7xl mx-auto px-6 w-full flex-grow pb-20">
            <div id="selectedType" class="text-center mb-8 text-lg font-semibold text-tcf-green uppercase tracking-widest hidden"></div>
            
            <div id="queryList" class="grid md:grid-cols-2 lg:grid-cols-2 gap-6">
                <!-- Welcome State -->
                <div class="col-span-full flex flex-col items-center justify-center p-12 bg-tcf-dark-grey border border-white/5 rounded-3xl text-center">
                    <i class="fas fa-inbox text-5xl text-gray-600 mb-4"></i>
                    <p class="text-gray-400 text-lg">Select "All Queries" or "Pending Queries" to begin managing tickets.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== MODALS ==================== -->

    <!-- Department Selection Modal -->
    <div id="departmentModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm items-center justify-center modal-enter p-4">
        <div class="bg-tcf-dark-grey border border-white/10 rounded-2xl w-full max-w-md shadow-2xl modal-content-enter overflow-hidden">
            <div class="p-6 border-b border-white/10 text-center">
                <h3 class="text-2xl font-bold text-white" id="modalTitle">Select Department</h3>
            </div>
            <div class="p-6 flex flex-col gap-4">
                <button onclick="selectDepartment('Scholarship-Section')" class="w-full bg-tcf-black border border-white/10 hover:border-tcf-green hover:text-tcf-green text-white px-6 py-4 rounded-xl font-bold uppercase tracking-wider transition duration-300 flex items-center justify-center gap-3">
                    <i class="fas fa-graduation-cap"></i> Scholarship Section
                </button>
                <button onclick="selectDepartment('Fee-Section')" class="w-full bg-tcf-black border border-white/10 hover:border-tcf-green hover:text-tcf-green text-white px-6 py-4 rounded-xl font-bold uppercase tracking-wider transition duration-300 flex items-center justify-center gap-3">
                    <i class="fas fa-wallet"></i> Fee Section
                </button>
            </div>
            <div class="p-4 bg-tcf-black/50 border-t border-white/10 flex justify-center">
                <button onclick="closeDepartmentModal()" class="text-gray-400 hover:text-red-400 font-bold uppercase text-sm tracking-widest transition">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Update Ticket Modal -->
    <div id="updateModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm items-center justify-center modal-enter p-4">
        <div class="bg-tcf-dark-grey border border-white/10 rounded-2xl w-full max-w-2xl shadow-2xl modal-content-enter max-h-[90vh] overflow-y-auto custom-scroll">
            <div class="p-6 border-b border-white/10 flex justify-between items-center sticky top-0 bg-tcf-dark-grey z-10">
                <h3 class="text-2xl font-bold text-tcf-green flex items-center gap-2">
                    <i class="fas fa-pen-to-square"></i> Update Ticket
                </h3>
                <button onclick="closeUpdateModal()" class="text-gray-400 hover:text-white transition">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6">
                <form id="updateForm" class="space-y-5">
                    <input type="hidden" id="updateQueryNo">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Query Number</label>
                            <input type="text" id="updateQueryNoDisplay" readonly class="w-full bg-tcf-black/50 border border-white/5 rounded-lg px-4 py-3 text-gray-500 font-mono text-sm cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">CNIC</label>
                            <input type="text" id="updateCnic" required class="w-full bg-tcf-black border border-white/10 rounded-lg px-4 py-3 text-white focus:border-tcf-green focus:ring-1 focus:ring-tcf-green transition text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Department</label>
                            <select id="updateDepartment" class="w-full bg-tcf-black border border-white/10 rounded-lg px-4 py-3 text-white focus:border-tcf-green focus:ring-1 focus:ring-tcf-green transition text-sm">
                                <option value="Scholarship-Section">Scholarship Section</option>
                                <option value="Fee-Section">Fee Section</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Status</label>
                            <select id="updateStatus" class="w-full bg-tcf-black border border-white/10 rounded-lg px-4 py-3 text-white focus:border-tcf-green focus:ring-1 focus:ring-tcf-green transition text-sm font-bold">
                                <option value="forwarded">FORWARDED (Pending)</option>
                                <option value="responded">RESPONDED (Resolved)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Original Query</label>
                        <textarea id="updateQuery" required rows="3" class="w-full bg-tcf-black border border-white/10 rounded-lg px-4 py-3 text-white focus:border-tcf-green focus:ring-1 focus:ring-tcf-green transition text-sm resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1 flex justify-between">
                            Response/Resolution <span class="text-tcf-green font-normal normal-case">*(Will be visible to user)</span>
                        </label>
                        <textarea id="updateResponse" placeholder="Draft your official response here..." rows="4" class="w-full bg-tcf-black border border-white/10 rounded-lg px-4 py-3 text-white focus:border-tcf-green focus:ring-1 focus:ring-tcf-green transition text-sm resize-none placeholder-gray-700"></textarea>
                    </div>

                    <div class="pt-4 flex gap-3 border-t border-white/10">
                        <button type="button" onclick="closeUpdateModal()" class="flex-1 bg-transparent border border-white/20 hover:border-white text-white font-bold py-3 rounded-lg uppercase tracking-wider transition">
                            Cancel
                        </button>
                        <button type="submit" class="flex-1 bg-tcf-green hover:bg-white text-tcf-black font-bold py-3 rounded-lg uppercase tracking-wider transition">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script>
        let currentQueryType = null; 
        let currentDepartment = null;

        // --- Modals Logic ---
        function showDepartmentModal(type) {
            currentQueryType = type;
            const modalTitle = document.getElementById('modalTitle');
            if (type === 'all') {
                modalTitle.innerHTML = '<i class="fas fa-layer-group text-blue-400 mr-2"></i> All Queries';
            } else {
                modalTitle.innerHTML = '<i class="fas fa-hourglass-half text-amber-400 mr-2"></i> Pending Queries';
            }
            const modal = document.getElementById('departmentModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDepartmentModal() {
            const modal = document.getElementById('departmentModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function showUpdateModal() {
            const modal = document.getElementById('updateModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeUpdateModal() {
            const modal = document.getElementById('updateModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // --- Data Fetching ---
        function selectDepartment(department) {
            currentDepartment = department;
            closeDepartmentModal();
            
            if (currentQueryType === 'all') {
                loadAllQueries();
            } else if (currentQueryType === 'pending') {
                loadPendingQueries();
            }
        }

        async function loadAllQueries() {
            const label = document.getElementById('selectedType');
            label.innerHTML = `📌 Displaying ALL Tickets for <span class="text-white">${currentDepartment.replace('-Section', '')}</span>`;
            label.classList.remove('hidden');
            
            showLoadingState();
            
            try {
                const response = await fetch(`/api/query-management/department/${currentDepartment}`);
                const result = await response.json();
                
                if (result.success) {
                    displayQueries(result.data);
                } else {
                    showErrorState('Failed to load queries.');
                }
            } catch (error) {
                console.error('Error:', error);
                showErrorState('Network error loading queries.');
            }
        }

        async function loadPendingQueries() {
            const label = document.getElementById('selectedType');
            label.innerHTML = `⏳ Displaying PENDING Tickets for <span class="text-white">${currentDepartment.replace('-Section', '')}</span>`;
            label.classList.remove('hidden');
            
            showLoadingState();
            
            try {
                const response = await fetch(`/api/query-management/pending/${currentDepartment}`);
                const result = await response.json();
                
                if (result.success) {
                    displayQueries(result.data);
                } else {
                    showErrorState('Failed to load pending queries.');
                }
            } catch (error) {
                console.error('Error:', error);
                showErrorState('Network error loading pending queries.');
            }
        }

        // --- UI Rendering ---
        function showLoadingState() {
            document.getElementById('queryList').innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center p-12">
                    <i class="fas fa-circle-notch fa-spin text-4xl text-tcf-green mb-4"></i>
                    <p class="text-gray-400 font-bold uppercase tracking-widest text-sm">Fetching Database...</p>
                </div>
            `;
        }

        function showErrorState(msg) {
            document.getElementById('queryList').innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center p-12 bg-red-500/10 border border-red-500/20 rounded-3xl">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                    <p class="text-red-400 font-bold uppercase tracking-widest text-sm">${msg}</p>
                </div>
            `;
        }

        function displayQueries(queries) {
            const container = document.getElementById('queryList');
            
            if (!queries || queries.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center p-12 bg-tcf-dark-grey border border-white/5 rounded-3xl">
                        <i class="fas fa-check-circle text-4xl text-gray-600 mb-4"></i>
                        <p class="text-gray-400 font-bold uppercase tracking-widest text-sm">No tickets found for this filter.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = queries.map(query => {
                const isPending = query.status === 'forwarded';
                const statusColor = isPending ? 'text-amber-400 bg-amber-400/10 border-amber-400/20' : 'text-tcf-green bg-tcf-green/10 border-tcf-green/20';
                const dateObj = new Date(query.createdAt);
                
                return `
                <div class="bg-tcf-dark-grey border border-white/10 rounded-2xl p-6 shadow-xl hover:border-white/30 transition duration-300 flex flex-col h-full group">
                    <div class="flex justify-between items-start mb-4 border-b border-white/10 pb-4">
                        <div>
                            <div class="text-xl font-bold text-white font-mono">${query.query_no}</div>
                            <div class="text-xs text-gray-500 mt-1"><i class="fas fa-calendar-alt mr-1"></i> ${dateObj.toLocaleDateString()} at ${dateObj.toLocaleTimeString()}</div>
                        </div>
                        <div class="px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-widest border ${statusColor}">
                            ${isPending ? 'PENDING' : 'RESPONDED'}
                        </div>
                    </div>
                    
                    <div class="flex-grow space-y-4">
                        <div>
                            <span class="text-[10px] text-gray-500 font-bold uppercase tracking-widest block mb-1">User Query (CNIC: ${query.cnic})</span>
                            <p class="text-sm text-gray-200 leading-relaxed bg-tcf-black p-3 rounded-lg border border-white/5">
                                ${escapeHtml(query.query)}
                            </p>
                        </div>
                        
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-widest block mb-1 ${isPending ? 'text-gray-500' : 'text-tcf-green'}">Official Response</span>
                            ${query.response 
                                ? `<p class="text-sm text-tcf-green leading-relaxed bg-tcf-green/5 p-3 rounded-lg border border-tcf-green/10 italic">${escapeHtml(query.response)}</p>` 
                                : `<p class="text-xs text-gray-600 italic">No response drafted yet.</p>`
                            }
                        </div>
                    </div>
                    
                    <div class="pt-5 mt-4 border-t border-white/10 flex gap-3">
                        <button onclick="editQuery('${query.query_no}')" class="flex-1 bg-white/5 hover:bg-white/10 border border-white/10 text-white py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition flex items-center justify-center gap-2">
                            <i class="fas fa-pen text-blue-400"></i> Edit
                        </button>
                        <button onclick="deleteQuery('${query.query_no}')" class="flex-1 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition flex items-center justify-center gap-2">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        // --- Operations ---
        async function editQuery(queryNo) {
            try {
                const response = await fetch(`/api/query-management/${queryNo}`);
                const result = await response.json();
                
                if (result.success) {
                    const query = result.data;
                    document.getElementById('updateQueryNo').value = query.query_no;
                    document.getElementById('updateQueryNoDisplay').value = query.query_no;
                    document.getElementById('updateCnic').value = query.cnic;
                    document.getElementById('updateQuery').value = query.query;
                    document.getElementById('updateDepartment').value = query.department;
                    document.getElementById('updateResponse').value = query.response || '';
                    document.getElementById('updateStatus').value = query.status;
                    showUpdateModal();
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error loading query details.');
            }
        }

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const queryNo = document.getElementById('updateQueryNo').value;
            const updateData = {
                cnic: document.getElementById('updateCnic').value,
                query: document.getElementById('updateQuery').value,
                department: document.getElementById('updateDepartment').value,
                response: document.getElementById('updateResponse').value,
                status: document.getElementById('updateStatus').value
            };
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(`/api/query-management/${queryNo}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    closeUpdateModal();
                    // Refresh current view
                    if (currentQueryType === 'all') loadAllQueries();
                    else if (currentQueryType === 'pending') loadPendingQueries();
                } else {
                    alert('Error updating ticket: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Server error updating ticket.');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        async function deleteQuery(queryNo) {
            if (confirm(`Are you sure you want to permanently delete Ticket ${queryNo}?`)) {
                try {
                    const response = await fetch(`/api/query-management/${queryNo}`, {
                        method: 'DELETE'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // Refresh current view
                        if (currentQueryType === 'all') loadAllQueries();
                        else if (currentQueryType === 'pending') loadPendingQueries();
                    } else {
                        alert('Error deleting ticket: ' + result.message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Server error deleting ticket.');
                }
            }
        }

        // --- Utilities ---
        function escapeHtml(text) {
            if (!text) return "";
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Close modals when clicking outside the box
        window.onclick = function(event) {
            const departmentModal = document.getElementById('departmentModal');
            const updateModal = document.getElementById('updateModal');
            if (event.target === departmentModal) closeDepartmentModal();
            if (event.target === updateModal) closeUpdateModal();
        }
    </script>
</body>
</html>
